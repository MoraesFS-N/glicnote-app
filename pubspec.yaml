name: glicnote_app
description: Acompanhamento glicemico com design system GlicNote.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  uuid: ^4.6.0
  flutter_timezone: ^5.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences: ^2.5.6
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Istok Web
      fonts:
        - asset: assets/fonts/istok_web/IstokWeb-Regular.ttf
          weight: 400
        - asset: assets/fonts/istok_web/IstokWeb-Bold.ttf
          weight: 700
        - asset: assets/fonts/istok_web/IstokWeb-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/istok_web/IstokWeb-BoldItalic.ttf
          weight: 700
          style: italic
